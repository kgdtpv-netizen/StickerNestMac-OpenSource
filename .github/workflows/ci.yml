name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q Tools
      - name: Run policy and regression tests
        run: |
          for test_file in Tools/test_*.py; do
            python "$test_file" || exit 1
          done

  macos-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: zsh build.zsh
